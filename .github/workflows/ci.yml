name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · test · typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Integration tests run against disposable service containers. Mock/CI-only
    # credentials are used; no real provider or payment secret is ever needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fahimni
          POSTGRES_PASSWORD: fahimni-ci-password
          POSTGRES_DB: fahimni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fahimni -d fahimni_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Safe, non-secret values. AUTH_SECRET is generated per run.
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://fahimni:fahimni-ci-password@127.0.0.1:5432/fahimni_test
      DATABASE_URL: postgresql://fahimni:fahimni-ci-password@127.0.0.1:5432/fahimni_test
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      # Provider keys are intentionally empty: tests use simulated transports.
      OPENAI_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      # Version intentionally omitted: it is declared by "packageManager" in
      # package.json (pnpm@11.25.0). Specifying both causes pnpm/action-setup to
      # fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build:next
        env:
          NODE_ENV: production

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare isolated browser fixtures
        run: |
          pnpm db:seed
          pnpm dev:setup

      - name: Start local review server
        run: |
          NODE_ENV=development DEV_LOGIN_ENABLED=true NEXT_DIST_DIR=.next-recovery pnpm dev:next --port 3010 > /tmp/fahimni-browser-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3010/api/status > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fahimni-browser-server.log
          exit 1

      - name: Browser journeys and visual regression assertions
        run: pnpm test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-browser-evidence
          path: |
            test-results/
            docs/reviews/recovery/after/
            /tmp/fahimni-browser-server.log

  # Independent clean-runner build, in addition to the browser journeys above.
  production-build-repro:
    name: production build (reproducibility)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      NEXT_PUBLIC_VISUAL_DEV_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      # Version intentionally omitted (see note in the verify job): the version
      # comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build:next
        env:
          NODE_ENV: production
